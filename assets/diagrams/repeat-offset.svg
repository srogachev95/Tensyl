<polyline points="523.500,117.000 523.500,89.000" fill="none" stroke="#72838d" stroke-width="1"/>
<polyline points="512.500,89.000 523.500,89.000" fill="none" stroke="#18344a" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="518.000" y="74.000" font-size="16" fill="#18344a" text-anchor="middle" font-weight="400">2 mm web</text>
<text x="560.000" y="173.000" font-size="16" fill="#b65020" text-anchor="start" font-weight="400">Rib centroid</text>
<polyline points="628.000,265.500 647.000,291.000 680.000,291.000" fill="none" stroke="#72838d" stroke-width="1"/>
<text x="687.000" y="297.000" font-size="16" fill="#18344a" text-anchor="start" font-weight="400">2 mm</text>
<text x="427.000" y="323.000" font-size="16" fill="#18344a" text-anchor="start" font-weight="400">Skin midplane: z = 0</text>
<polyline points="711.000,160.000 711.000,104.000" fill="none" stroke="#18344a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="711.000" y="91.000" font-size="16" fill="#18344a" text-anchor="middle" font-weight="400">+n</text>
<text x="26.000" y="367.000" font-size="16" fill="#18344a" text-anchor="start" font-weight="400">Dashed boundary: halfway to the neighboring rib intersections.</text>
</g>
</svg>

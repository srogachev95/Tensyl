site_name: Tensyl
site_description: Equivalent-stiffness homogenization tools for stiffened plates and shells.
site_url: https://srogachev95.github.io/Tensyl/
repo_url: https://github.com/srogachev95/Tensyl
docs_dir: docs
strict: true
theme:
  name: readthedocs
  logo: assets/brand/tensyl-logo.jpeg
exclude_docs: |
  internal/**
  llm_wiki/**
  includes/**
markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_if_no_docstring: true
            show_source: false
            inherited_members: true
nav:
  - Start Here:
      - Overview: index.md
      - Installation: getting-started/installation.md
      - Skin Stiffness: getting-started/first-abd-stiffness.md
      - Add Stiffeners: getting-started/first-homogenized-cell.md
      - Apply Loads and Save: getting-started/use-the-result.md
  - How the Model Works:
      - Plate Stiffness: theory/equivalent-stiffness.md
      - Energy Homogenization: theory/tangent-plane-homogenization.md
      - Axes and Reference Surface: theory/conventions.md
      - Units: user-guide/units-and-consistency.md
      - Modeling Choices: theory/validity.md
  - Building a Model:
      - Materials and Laminates: user-guide/materials-and-laminates.md
      - Sections and Rib Patterns: user-guide/beam-sections-and-cells.md
      - Surfaces and Fields: user-guide/geometry-and-fields.md
  - Using the Results:
      - Loads, Mass, and Reports: user-guide/homogenization.md
      - Files and Design Sweeps: user-guide/external-workflows.md
      - Sampled Stiffness: examples/sampled-stiffness-atlas.md
      - Stiffness Maps: examples/stiffness-field-maps.md
      - Solver Handoff: user-guide/solver-handoff.md
      - SP-8007 Inputs: user-guide/sp8007-data-handoff.md
  - Verification:
      - Evidence Overview: validation/index.md
      - Nemeth Formulas: validation/nemeth-cells.md
      - SP-8007 Reconciliation: validation/sp8007-reconciliation.md
  - Reference:
      - Glossary: background/terminology.md
      - History and Motivation: background/motivation.md
      - Sources: references.md
      - API:
          - Core: api/core.md
          - Materials: api/materials.md
          - Cells and Sections: api/cells-and-sections.md
          - Homogenizers: api/homogenizers.md
          - Geometry and Fields: api/geometry-and-fields.md
          - Files: api/io.md
          - Solver Adapters: api/adapters.md

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title"><title id="title">Rotation changes the in-plane axes; reference shift moves the surface</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#176b87"/></marker></defs><rect width="800" height="260" fill="#f6f9fc"/><g font-family="Arial,sans-serif" font-size="17" fill="#18344a" stroke-linecap="round" stroke-linejoin="round"><g fill="none" stroke="#176b87" stroke-width="2" marker-end="url(#arrow)"><path d="M100 190H290 M100 190V40 M100 190L270 85 M100 190L45 95"/><path d="M480 190V35 M665 180V105"/></g><g stroke="#c46127" stroke-width="3"><path d="M430 180H750 M430 105H750"/></g><text x="285" y="213">e1</text><text x="110" y="45">e2</text><text x="270" y="75">e1′</text><text x="20" y="80">e2′</text><text x="100" y="235">Rotate axes in the plane</text><text x="490" y="42">+n</text><text x="525" y="95">New reference</text><text x="525" y="205">Old reference</text><text x="678" y="148">+d</text><text x="475" y="235">Shift the reference along +n</text></g></svg>
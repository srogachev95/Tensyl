<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title"><title id="title">Repeat dimensions and rib centroid measured from the skin midplane</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#176b87"/></marker></defs><rect width="800" height="260" fill="#f6f9fc"/><g font-family="Arial,sans-serif" font-size="17" fill="#18344a" stroke-linecap="round" stroke-linejoin="round"><g fill="none" stroke="#176b87" stroke-width="2"><rect x="60" y="55" width="240" height="130"/><path d="M60 120H300 M180 55V185" stroke-width="7"/><path d="M60 205H300 M325 185V55" marker-end="url(#arrow)"/><path d="M450 190H740" stroke-dasharray="6 5"/><rect x="450" y="179" width="290" height="22" fill="#c3d9e8"/><rect x="590" y="50" width="20" height="129" fill="#c3d9e8"/><path d="M500 165V45 M690 190V115" marker-end="url(#arrow)"/><path d="M610 115H710" stroke-dasharray="4 4"/></g><circle cx="600" cy="115" r="5" fill="#c46127"/><text x="90" y="232">e1 pitch = 150 mm</text><text x="27" y="27">e2 pitch = 100 mm</text><text x="490" y="32">+n</text><text x="640" y="102">Centroid</text><text x="710" y="150">+z</text><text x="465" y="235">Reference: skin midplane</text></g></svg>
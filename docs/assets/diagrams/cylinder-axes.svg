<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-labelledby="title"><title id="title">Cylinder axial, circumferential, and outward normal directions</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#176b87"/></marker></defs><rect width="800" height="280" fill="#f6f9fc"/><g font-family="Arial,sans-serif" font-size="17" fill="#18344a" stroke-linecap="round" stroke-linejoin="round"><g fill="none" stroke="#176b87" stroke-width="2"><ellipse cx="200" cy="130" rx="45" ry="90"/><ellipse cx="590" cy="130" rx="45" ry="90"/><path d="M200 40H590 M200 220H590"/><path d="M370 40H490 M370 40V8 M370 40Q425 70 410 115" stroke-width="3" marker-end="url(#arrow)"/></g><circle cx="370" cy="40" r="5" fill="#c46127"/><text x="490" y="32">e1: axial</text><text x="265" y="22">n: outward</text><text x="430" y="110">e2: circumferential</text><text x="270" y="250">Local directions move with the surface point</text></g></svg>